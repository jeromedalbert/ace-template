name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *" # Every day at 10 am UTC

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.5
          bundler-cache: true

      - name: Run rubocop
        run: bundle exec rubocop '*.rb' 'test/*.rb' Gemfile Rakefile

      - name: Run SyntaxTree
        run: bundle exec stree check '*.rb' 'test/*.rb' Gemfile Rakefile

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: [3.3.5]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Install Rails
        run: gem install rails -v '~> 8.0.0.rc1'

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Run tests
        run: bundle exec rake test
